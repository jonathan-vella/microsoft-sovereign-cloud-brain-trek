<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 520">
  <title id="title">Azure Local Storage Spaces Direct architecture</title>
  <desc id="desc">Direct-attached NVMe or SSD drives feed Storage Spaces Direct, a shared storage pool, resiliency choices, cluster shared volumes, and virtual machines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F6CBD" />
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #1f1f1f; }
      .box { fill: #F7FAFD; stroke: #0F6CBD; stroke-width: 2; rx: 16; }
      .green { fill: #EAF6EA; stroke: #107C10; }
      .orange { fill: #FFF4E6; stroke: #FF8C00; }
      .line { stroke: #0F6CBD; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .muted { fill: #4f5f6f; font-size: 14px; }
      .h { font-size: 20px; font-weight: 600; }
      .t { font-size: 15px; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#FFFFFF" />
  <text x="40" y="48" class="h">Storage Spaces Direct in Azure Local</text>
  <text x="40" y="74" class="muted">Hyperconverged direct-attached storage path. SAN-backed designs use the disaggregated or multi-rack model.</text>

  <rect x="40" y="120" width="200" height="135" class="box orange" />
  <text x="70" y="154" class="h">Machines</text>
  <text x="70" y="184" class="t">Same supported model</text>
  <text x="70" y="208" class="t">Direct-attached drives</text>
  <text x="70" y="232" class="t">NVMe or SSD preferred</text>

  <rect x="290" y="120" width="195" height="135" class="box" />
  <text x="322" y="154" class="h">Storage bus</text>
  <text x="322" y="184" class="t">Cluster traffic</text>
  <text x="322" y="208" class="t">SMB over storage</text>
  <text x="322" y="232" class="t">RDMA where supported</text>

  <rect x="520" y="120" width="180" height="135" class="box green" />
  <text x="552" y="154" class="h">Storage pool</text>
  <text x="552" y="184" class="t">Shared pool</text>
  <text x="552" y="208" class="t">Across nodes</text>
  <text x="552" y="232" class="t">Health monitored</text>

  <rect x="750" y="120" width="170" height="135" class="box" />
  <text x="782" y="154" class="h">Resiliency</text>
  <text x="782" y="184" class="t">Mirror</text>
  <text x="782" y="208" class="t">Dual parity</text>
  <text x="782" y="232" class="t">Fault domains</text>

  <rect x="270" y="340" width="190" height="110" class="box green" />
  <text x="305" y="376" class="h">CSV volumes</text>
  <text x="305" y="406" class="t">VM files</text>
  <text x="305" y="430" class="t">Cluster shared access</text>

  <rect x="520" y="340" width="230" height="110" class="box orange" />
  <text x="560" y="376" class="h">Workloads</text>
  <text x="560" y="406" class="t">Azure Local VMs</text>
  <text x="560" y="430" class="t">AKS storage consumers</text>

  <path d="M 240 188 L 290 188" class="line" />
  <path d="M 485 188 L 520 188" class="line" />
  <path d="M 700 188 L 750 188" class="line" />
  <path d="M 835 255 C 835 310 690 305 615 340" class="line" />
  <path d="M 460 395 L 520 395" class="line" />
</svg>
