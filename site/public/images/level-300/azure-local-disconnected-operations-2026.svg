  <path d="M 828 92 L 848 100 M 848 92 L 828 100" stroke="#C50F1F" stroke-width="2" fill="none"/>
  <rect x="20" y="108" width="920" height="476" rx="14" fill="none" stroke="#0F6CBD" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="132" font-family="Inter Variable, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F6CBD" text-anchor="start">Customer datacenter boundary</text>
