<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="dco-title dco-desc">
  <title id="dco-title">Azure Local disconnected operations</title>
  <desc id="dco-desc">A customer datacenter with no connection to Azure. A management cluster of three or more Azure Local machines runs the disconnected operations appliance, a local control plane with the Azure portal, Azure Resource Manager, RBAC, managed identity, Key Vault, Container Registry, Azure Policy, and Arc-enabled servers. It manages workload Azure Local instances that run Azure Local VMs, AKS enabled by Azure Arc (preview), and Microsoft 365 Local. Active Directory with AD FS provides identity, the customer PKI issues certificates, and updates and expansion packs arrive on transferred media.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#F7FAFD"/><stop offset="100%" stop-color="#EEF5FC"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6CBD"/></marker>
  </defs>
  <rect width="960" height="600" rx="12" fill="url(#bg)"/>
  <text x="32" y="44" font-family="Inter Variable, Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#0C3B5E" text-anchor="start">Azure Local disconnected operations</text>
  <text x="32" y="68" font-family="Inter Variable, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#616161" text-anchor="start">GA from Azure Local 2602. AKS enabled by Azure Arc under disconnected operations is in preview.</text>
