  <text x="58" y="174" font-family="Inter Variable, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#107C10" text-anchor="start">Management cluster</text>
  <text x="58" y="194" font-family="Inter Variable, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#242424" text-anchor="start">Dedicated Azure Local instance, 3 or more machines in production</text>
