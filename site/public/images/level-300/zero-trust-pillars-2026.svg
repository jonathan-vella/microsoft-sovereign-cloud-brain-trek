  <text x="480.0" y="111.0" font-family="Inter Variable, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Use least privilege access</text>
  <rect x="638" y="88" width="292" height="38" rx="6" fill="#0F6CBD" stroke="#0F6CBD" stroke-width="1"/>
  <text x="784.0" y="111.0" font-family="Inter Variable, Segoe UI, sans-serif" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Assume breach</text>
