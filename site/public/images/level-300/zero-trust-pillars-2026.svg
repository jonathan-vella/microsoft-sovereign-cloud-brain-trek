<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ztp-title ztp-desc">
  <title id="ztp-title">Zero Trust: principles, policy engine, and seven technology pillars</title>
  <desc id="ztp-desc">Three principles, verify explicitly, use least privilege access, and assume breach, apply through Conditional Access as the policy engine to seven technology pillars: Identities, Endpoints, Data, Apps, Infrastructure, Network, and SecOps, each with example Microsoft products. The adoption model has four layers: business scenarios, security disciplines, technology pillars, and technical solutions.</desc>
