  <text x="32" y="68" font-family="Inter Variable, Segoe UI, sans-serif" font-size="13" font-weight="400" fill="#616161" text-anchor="start">An Azure landing zone variant. Highlighted groups are added by the Sovereign Landing Zone.</text>
