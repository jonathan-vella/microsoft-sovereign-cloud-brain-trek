  <path d="M 480 124 L 480 144" stroke="#616161" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 480 178 L 480 196 L 170 196 L 170 214 M 480 196 L 640 196 L 640 214 M 480 196 L 862 196 L 862 214" stroke="#616161" stroke-width="1.6" fill="none"/>
