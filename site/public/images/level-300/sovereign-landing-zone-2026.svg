<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="slz-title slz-desc">
  <title id="slz-title">Sovereign Landing Zone management group hierarchy</title>
  <desc id="slz-desc">The Sovereign Landing Zone extends the Azure landing zone hierarchy. Under Platform it adds a Security management group that hosts Managed HSM next to Management, Connectivity, and Identity. Under Landing zones it adds Public, Confidential Online, and Confidential Corp next to Online and Corp. Public applies Azure landing zone defaults only, Online and Corp add Level 1 data residency and Level 2 encryption at rest and in transit, and the Confidential groups add Level 3 encryption in use. Platform services need Level 1 and Level 2, and Level 3 where possible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#F7FAFD"/><stop offset="100%" stop-color="#EEF5FC"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#616161"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6CBD"/></marker>
  </defs>
  <rect width="960" height="620" rx="12" fill="url(#bg)"/>
