<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="flp-title flp-desc">
  <title id="flp-title">Foundry Local on Azure Local in production</title>
  <desc id="flp-desc">Applications and Agentic Retrieval, formerly Edge RAG, call inference endpoints through a Kubernetes Gateway API gateway built on Istio with TLS. For multi-replica vLLM deployments on GPU nodes, the Endpoint Picker routes each request to the best replica based on live inference signals; ONNX-GenAI deployments on CPU or GPU nodes are reached through the gateway route directly. The inference operator reconciles Model and ModelDeployment resources and uses a node-local model cache. The multi-node AKS cluster runs on Azure Local and is managed as an Azure Arc extension from Azure or from disconnected operations. Both Foundry Local on Azure Local and Agentic Retrieval are in preview.</desc>
