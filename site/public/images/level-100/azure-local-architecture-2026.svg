<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="azlocal-title azlocal-desc">
  <title id="azlocal-title">Azure Local architecture</title>
  <desc id="azlocal-desc">Architecture diagram showing Azure management services connected through Azure Arc to an on-premises Azure Local instance with workload, platform, and validated hardware layers.</desc>
  <defs>
    <marker id="arrow-azlocal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-start-azlocal" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#0078D4"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", "Segoe UI Variable", Inter, system-ui, sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #243A5E; }
      .subtitle { font-size: 15px; fill: #605E5C; }
      .heading { font-size: 20px; font-weight: 700; fill: #243A5E; }
      .label { font-size: 15px; fill: #323130; }
      .small { font-size: 14px; fill: #605E5C; }
      .chip { font-size: 14px; font-weight: 600; fill: #003A6C; }
      .tableHead { font-size: 14px; font-weight: 700; fill: #243A5E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="860" rx="16" fill="#FFFFFF"/>
  <rect x="28" y="28" width="1144" height="804" rx="18" fill="#F7FAFD" stroke="#DEECF9"/>

  <text class="font title" x="60" y="76">Azure Local architecture</text>
  <text class="font subtitle" x="60" y="104">Azure management connects through Azure Arc to an on-premises Azure Local instance.</text>

  <rect x="60" y="135" width="1080" height="155" rx="16" fill="#DEECF9" stroke="#8ABFE6"/>
  <text class="font heading" x="90" y="174">Azure</text>
  <g transform="translate(90 200)">
    <rect x="0" y="0" width="132" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="66" y="27" text-anchor="middle">Azure portal</text>
    <rect x="150" y="0" width="178" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="239" y="27" text-anchor="middle">Azure Resource Manager</text>
    <rect x="346" y="0" width="126" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="409" y="27" text-anchor="middle">Azure Policy</text>
    <rect x="490" y="0" width="136" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="558" y="27" text-anchor="middle">Azure Monitor</text>
    <rect x="644" y="0" width="214" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="751" y="27" text-anchor="middle">Microsoft Defender for Cloud</text>
    <rect x="876" y="0" width="142" height="42" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font chip" x="947" y="27" text-anchor="middle">Microsoft Entra ID</text>
  </g>

  <path d="M600 290 L600 364" stroke="#0078D4" stroke-width="3" marker-start="url(#arrow-start-azlocal)" marker-end="url(#arrow-azlocal)"/>
  <rect x="522" y="312" width="156" height="42" rx="21" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <text class="font heading" x="600" y="340" text-anchor="middle">Azure Arc</text>

  <rect x="80" y="380" width="830" height="390" rx="20" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5"/>
  <text class="font heading" x="110" y="424">Azure Local instance</text>
  <text class="font small" x="110" y="449">On-premises infrastructure connected to Azure</text>

  <g transform="translate(120 478)">
    <rect x="0" y="0" width="750" height="78" rx="12" fill="#EFF6FC" stroke="#8ABFE6"/>
    <text class="font tableHead" x="24" y="30" font-weight="700" fill="#243A5E">Workloads</text>
    <rect x="140" y="20" width="282" height="38" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font label" x="281" y="44" text-anchor="middle">Azure Local VMs enabled by Azure Arc</text>
    <rect x="445" y="20" width="178" height="38" rx="10" fill="#FFFFFF" stroke="#8ABFE6"/>
    <text class="font label" x="534" y="44" text-anchor="middle">AKS on Azure Local</text>
  </g>

  <g transform="translate(120 580)">
    <rect x="0" y="0" width="750" height="86" rx="12" fill="#F3F2F1" stroke="#C8C6C4"/>
    <text class="font tableHead" x="24" y="32" font-weight="700" fill="#243A5E">Platform</text>
    <text class="font label" x="152" y="32">Azure Local OS</text>
    <text class="font small" x="152" y="58">Hyper-V, Storage Spaces Direct, failover clustering, software-defined networking</text>
  </g>

  <g transform="translate(120 690)">
    <rect x="0" y="0" width="750" height="58" rx="12" fill="#E6F4F1" stroke="#80C6BA"/>
    <text class="font tableHead" x="24" y="36" font-weight="700" fill="#243A5E">Hardware</text>
    <text class="font label" x="152" y="36">Validated machines from the Azure Local catalog, 1-16 in a hyperconverged instance</text>
  </g>

  <rect x="940" y="380" width="200" height="390" rx="16" fill="#FFFFFF" stroke="#C8C6C4"/>
  <text class="font heading" x="970" y="424">Deployment</text>
  <text class="font heading" x="970" y="450">types</text>
  <g transform="translate(970 486)">
    <circle cx="8" cy="8" r="5" fill="#008575"/>
    <text class="font small" x="24" y="13">Hyperconverged</text>
    <text class="font small" x="24" y="34">1-16 machines</text>
    <circle cx="8" cy="73" r="5" fill="#008575"/>
    <text class="font small" x="24" y="78">Disaggregated</text>
    <text class="font small" x="24" y="99">1-64 machines</text>
    <circle cx="8" cy="138" r="5" fill="#008575"/>
    <text class="font small" x="24" y="143">Multi-rack</text>
    <text class="font small" x="24" y="164">Up to 128 nodes</text>
  </g>
</svg>
