<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="srm-title srm-desc">
  <title id="srm-title">Shared responsibility matrix</title>
  <desc id="srm-desc">Who is responsible for each area of the stack in on-premises, IaaS, PaaS, and SaaS. The customer always owns customer data, configurations and settings, and identities and users. The cloud provider owns physical hosts, network, and datacenter in every cloud model. Client devices, applications, network controls, and the operating system shift between customer, shared, and provider as you move from IaaS to SaaS.</desc>
