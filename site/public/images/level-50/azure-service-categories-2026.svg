<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Azure service categories</title>
  <desc id="sc-desc">Ten Azure service categories with example services. Core categories covered in depth by Azure Fundamentals: compute (Virtual Machines, App Service, Azure Functions, Azure Kubernetes Service), networking (Virtual Network, VPN Gateway, ExpressRoute, Azure DNS), storage (Blob Storage, Azure Files, Managed Disks, Queue Storage), and identity and security (Microsoft Entra ID, Azure Key Vault, Defender for Cloud). Other categories: databases, AI and machine learning (Microsoft Foundry, Foundry Tools, Azure Machine Learning), analytics, integration, Internet of Things, and management and governance.</desc>
